services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: railstorm
      POSTGRES_DB: railstorm
      # This is an isolated synthetic local lab; PostgreSQL is not published to the host.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ledger:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railstorm -d railstorm"]
      interval: 2s
      timeout: 3s
      retries: 30
  command-center:
    build: .
    environment:
      RAILSTORM_DATABASE_URL: postgresql+psycopg://railstorm@db:5432/railstorm
      # Loopback host forwarding arrives through the exact container bridge gateway.
      RAILSTORM_TRUST_LOCAL_COMPOSE_GATEWAY: "1"
    ports:
      - "127.0.0.1:${RAILSTORM_PORT:-8840}:8840"
    volumes:
      - evidence:/app/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8840/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
volumes:
  ledger:
  evidence:
