[project]
name = "railstorm"
version = "0.1.1"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.5",
    "SQLAlchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "PyYAML==6.0.3",
    "websockets==15.0.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["railstorm"]

[dependency-groups]
dev = ["pytest==8.3.4", "hypothesis==6.140.2", "httpx==0.28.1", "ruff==0.17.3", "mypy==2.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
